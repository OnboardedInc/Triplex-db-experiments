<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triplex Inspector</title>
<style>
:root { --bg:#fafaf9; --panel:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#2563eb; --ok:#15803d; --warn:#b45309; --bar:#93c5fd; --bar2:#fca5a5; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --panel:#1c1917; --ink:#f5f5f4; --muted:#a8a29e; --line:#292524; --accent:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --bar:#1d4ed8; --bar2:#b91c1c; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:16px; align-items:baseline; }
header h1 { font-size:16px; margin:0; }
main { display:grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap:12px; padding:12px 16px; }
section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
h2 { font-size:14px; margin:0 0 8px; display:flex; justify-content:space-between; gap:8px; }
.timing { font:12px ui-monospace, monospace; color:var(--muted); font-weight:normal; }
.big { font-size:20px; font-weight:600; }
.muted { color:var(--muted); }
label { font-size:12px; color:var(--muted); margin-right:4px; }
input, select, button { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--ink); }
button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th, td { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-all; }
th { color:var(--muted); font-weight:500; }
.scroll { max-height:360px; overflow:auto; }
.tl { position:relative; height:22px; background:var(--bg); border-radius:3px; margin:3px 0; }
.tl span { position:absolute; top:3px; height:16px; background:var(--bar); border-radius:3px; font-size:11px; padding:0 4px; overflow:hidden; white-space:nowrap; color:var(--ink); }
.tl span.retired { background:var(--bar2); opacity:.75; }
.err { color:var(--warn); white-space:pre-wrap; }
.ok { color:var(--ok); }
code { font:12px ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>Triplex inspector</h1>
  <div id="summary" class="muted">connecting…</div>
  <div class="row" style="margin:0">
    <label>account</label><select id="account"></select>
    <label>subject</label><input id="subject" type="number" min="0" value="0" style="width:90px">
    <button id="load">Load subject</button>
  </div>
</header>
<main>
  <section>
    <h2>Current facts <span class="timing" id="t-subject"></span></h2>
    <div class="row"><label>filter</label><input id="filter" placeholder="attribute or entity"></div>
    <div class="scroll"><table id="facts"></table></div>
  </section>
  <section>
    <h2>History of one field <span class="timing" id="t-history"></span></h2>
    <div class="row">
      <label>entity</label><select id="h-kind"><option>task</option><option>root</option><option>profile</option></select>
      <label>attribute</label><input id="h-attr" value=":task/field-0" style="width:160px">
      <button id="h-go">Show</button>
    </div>
    <div id="timeline"></div>
    <div class="scroll"><table id="history"></table></div>
  </section>
  <section>
    <h2>Both time axes at a date <span class="timing" id="t-at"></span></h2>
    <div class="row">
      <label>date</label><input id="at" style="width:230px">
      <label>attribute</label><input id="at-attr" value=":task/field-0" style="width:140px">
      <button id="at-go">Compare</button>
    </div>
    <div class="scroll"><table id="axes"></table></div>
  </section>
  <section>
    <h2>Change feed <span class="timing" id="t-feed"></span></h2>
    <div class="row">
      <label>after position</label><input id="f-after" type="number" style="width:120px" placeholder="last 20">
      <label><input id="f-acct" type="checkbox" checked> this account only</label>
      <button id="f-go">Refresh</button>
    </div>
    <div class="scroll"><table id="feed"></table></div>
  </section>
  <section>
    <h2>Apply a save <span class="timing" id="t-save"></span></h2>
    <p class="muted" style="margin-top:0">A real, durable, synchronous commit to the working copy. Then the readback, the field's history and the feed refresh.</p>
    <div class="row">
      <label>entity</label><select id="s-kind"><option>task</option><option>root</option><option>profile</option></select>
      <label>attribute</label><input id="s-attr" value=":task/field-0" style="width:140px">
      <label>value</label><input id="s-val" value="reviewed in demo" style="width:160px">
      <button id="s-go">Save</button>
    </div>
    <div id="saved"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (n) => (n === null || n === undefined ? "n/a" : Number(n).toLocaleString("en-US"));
const timing = (t, p) => t ? `gateway ${t.timing.serverMs ?? "n/a"} ms · round trip ${t.timing.roundTripMs} ms · ${t.timing.requests} req · position ${fmt(p ?? t.position)}` : "";
async function call(name, body = {}) {
  const res = await fetch("/api/" + name, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const json = await res.json();
  if (json.error) throw new Error(json.error.code + ": " + json.error.message);
  return json;
}
const who = () => ({ account: $("account").value, subject: Number($("subject").value) });
function fail(target, e) { $(target).innerHTML = `<tr><td class="err">${esc(e.message)}</td></tr>`; }

async function loadSummary() {
  const s = await call("summary");
  const range = s.recordTimeRange ?? {};
  if (range.first && range.lastAtBringUp && !$("at").dataset.set) {
    $("at").value = new Date((Date.parse(range.first) + Date.parse(range.lastAtBringUp)) / 2).toISOString();
    $("at").dataset.set = "1";
  }
  $("summary").innerHTML = `<span class="big">${fmt(s.recordsAtBringUp)}</span> records at bring-up · ${fmt(s.subjects)} subjects (worker records) in ${s.accounts} accounts · head <b>${fmt(s.head)}</b> (sealed ${fmt(s.sealedHead)}, +${fmt(s.transactionsSinceSeal)}) · record times ${esc((range.first ?? "").slice(0, 10))} to ${esc((range.lastAtBringUp ?? "").slice(0, 10))} · <span class="timing">${timing(s)}</span>`;
  const a = await call("accounts");
  $("account").innerHTML = a.accounts.map((x) => `<option value="${esc(x.account)}">${esc(x.account)} (${fmt(x.subjects)})</option>`).join("");
}
async function loadSubject() {
  try {
    const p = await call("subject", who());
    $("t-subject").textContent = timing(p) + ` · ${p.factCount} facts in ${p.entities} entities`;
    const f = $("filter").value.trim();
    $("facts").innerHTML = "<tr><th>entity</th><th>attribute</th><th>value</th><th>valid from</th><th>recorded</th></tr>" +
      p.facts.filter((x) => !f || x.attribute.includes(f) || x.entity.includes(f))
        .map((x) => `<tr><td>${esc(x.entity)}</td><td>${esc(x.attribute)}</td><td>${esc(x.value)}</td><td>${esc(x.validFrom)}</td><td>${esc(x.recordedAt)}</td></tr>`).join("");
  } catch (e) { fail("facts", e); }
}
async function loadHistory() {
  try {
    const h = await call("history", { ...who(), attribute: $("h-attr").value, kind: $("h-kind").value });
    $("t-history").textContent = timing(h) + ` · ${h.totalRows} rows of this field (${h.rowsShown} shown); the gateway read ${h.entityHistoryRows} rows of this entity's history`;
    const marks = [...new Set(h.rows.flatMap((r) => [r.recordedPosition, r.retiredPosition ?? h.position]))].sort((a, b) => a - b);
    const x = (p) => (marks.indexOf(p) / Math.max(marks.length - 1, 1)) * 92;
    $("timeline").innerHTML = '<div class="muted" style="font-size:11px">each row from the position that recorded it to the position that retired it (equal steps between changes); red = retired, blue = live</div>' +
      h.rows.map((r) => { const a = x(r.recordedPosition), b = x(r.retiredPosition ?? h.position);
        return `<div class="tl"><span class="${r.live ? "" : "retired"}" style="left:${a}%;width:${Math.max(b - a, 4)}%" title="${esc(r.value)}">${esc(r.value)}</span></div>`; }).join("");
    $("history").innerHTML = "<tr><th>value</th><th>valid from → to</th><th>recorded (position)</th><th>retired (position)</th></tr>" +
      h.rows.map((r) => `<tr><td>${esc(r.value)}</td><td>${esc(r.validFrom)} → ${esc(r.validTo ?? "open")}</td><td>${esc(r.recordedAt)} (${fmt(r.recordedPosition)})</td><td>${r.retiredAt ? esc(r.retiredAt) + " (" + fmt(r.retiredPosition) + ")" : "live"}</td></tr>`).join("");
  } catch (e) { fail("history", e); }
}
async function loadAxes() {
  try {
    const r = await call("at", { ...who(), at: $("at").value, attribute: $("at-attr").value || undefined });
    $("t-at").textContent = timing(r);
    const col = (list) => (list ?? []).map((f) => `${esc(f.entity)}: ${esc(f.value)}`).join("<br>") || "<span class='muted'>none</span>";
    $("axes").innerHTML = `<tr><th>today</th><th>true on ${esc(r.at)}, as known now</th><th>believed on ${esc(r.at)}</th></tr>` +
      `<tr><td>${col(r.current)}</td><td>${col(r.trueThenAsKnownNow)}</td><td>${col(r.believedThen)}</td></tr>` +
      `<tr><td colspan="3" class="muted">${r.differences.length} facts differ across the three views</td></tr>`;
  } catch (e) { fail("axes", e); }
}
async function loadFeed() {
  try {
    const after = $("f-after").value;
    const r = await call("feed", { after, account: $("f-acct").checked ? $("account").value : "", limit: 20 });
    $("t-feed").textContent = timing(r);
    $("feed").innerHTML = "<tr><th>position</th><th>recorded</th><th>command</th><th>changes</th></tr>" +
      r.transactions.slice().reverse().map((t) => `<tr><td>${fmt(t.position)}</td><td>${esc(t.recordedAt)}</td><td>${esc(t.commandId)}</td><td>${t.changes.map((c) => `${c.op} ${esc(c.entity.split("/").pop())} ${esc(c.attribute)} = ${esc(c.value)}`).join("<br>")}</td></tr>`).join("");
  } catch (e) { fail("feed", e); }
}
async function save() {
  try {
    const r = await call("save", { ...who(), kind: $("s-kind").value, changes: { [$("s-attr").value]: $("s-val").value } });
    $("t-save").textContent = timing(r);
    $("saved").innerHTML = `<p>Receipt <code>${esc(r.receipt.txId)}</code> at durable position <b>${fmt(r.receipt.position)}</b>, recorded ${esc(r.receipt.recordedAt)}. ` +
      `Readback at that position: <code>${esc(JSON.stringify(r.readback))}</code> <span class="${r.readbackMatches ? "ok" : "err"}">${r.readbackMatches ? "matches" : "DIFFERS"}</span></p>`;
    $("h-attr").value = $("s-attr").value; $("h-kind").value = $("s-kind").value;
    await Promise.all([loadSubject(), loadHistory(), loadFeed(), loadSummary()]);
  } catch (e) { $("saved").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
$("load").onclick = () => Promise.all([loadSubject(), loadHistory(), loadFeed()]);
$("filter").oninput = loadSubject;
$("h-go").onclick = loadHistory; $("at-go").onclick = loadAxes; $("f-go").onclick = loadFeed; $("s-go").onclick = save;
loadSummary().then(() => $("load").onclick()).catch((e) => { $("summary").innerHTML = `<span class="err">${esc(e.message)} (run demo/connect.sh)</span>`; });
</script>
</body>
</html>
