# [EXP-DA00] Why: same-container dev storage; never exposed outside loopback. Rejected: SQL storage (extra resident).
protocol=dev
host=127.0.0.1
alt-host=127.0.0.1
port=4334
h2-port=4335
data-dir=/data
log-dir=/data/log
pid-file=/data/transactor.pid
memory-index-threshold=32m
memory-index-max=192m
object-cache-max=96m
# [DX-JVM1] Why: pin the existing Datomic soft limits and heartbeat in the dev image.
# Rejected: letting upgraded defaults change storage concurrency or availability.
write-concurrency=4
read-concurrency=8
index-parallelism=1
heartbeat-interval-msec=5000
