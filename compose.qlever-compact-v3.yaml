name: triplex-qlever-compact-v3
services:
  qlever:
    image: adfreiburg/qlever:0.6.0@sha256:37d5ede193f1bffb6aebf734d15d2a4c2a3228ee102858b0c6c2e65c149a78ec
    container_name: triplex-qlever-compact-v3
    platform: linux/arm64
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    working_dir: /data
    entrypoint: ["qlever-server"]
    command:
      [
        "-i",
        "triplex",
        "-p",
        "7019",
        "-j",
        "4",
        "-m",
        "512M",
        "-c",
        "64M",
        "-e",
        "32M",
        "--persist-updates",
        "--no-patterns",
        "--no-access-check",
      ]
    ports: ["127.0.0.1:7019:7019"]
    volumes: ["./.qlever/compact-v3/data:/data"]
    labels:
      triplex.owner: triplex-db
      triplex.experiment: compact-v3
      triplex.profile: compact-v3
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "2"
    restart: "no"
